[workspace]
resolver = "2"
members = [
    "crates/moka-core",
    "crates/moka-process",
    "crates/moka-config",
    "crates/moka-sys",
    "crates/moka-gui",
]
default-members = ["crates/moka-gui"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = "2.6"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
